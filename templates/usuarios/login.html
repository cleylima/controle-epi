{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Controle EPI | EcoCristal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            font-family: "Segoe UI", sans-serif;

            background:
                linear-gradient(
                    90deg,
                    rgba(3, 15, 35, 0.30) 0%,
                    rgba(3, 15, 35, 0.42) 45%,
                    rgba(3, 15, 35, 0.70) 100%
                ),
                url("{% static 'img/login-background.png' %}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            display: flex;
            justify-content: center;

            margin-left: 10px;

            animation: entrada 0.7s ease;
        }

        .login-card {
            width: 100%;
            padding: 34px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;

            background: rgba(255, 255, 255, 0.94);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transform: translateY(-10px);
        }

        .marca {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #007d53,
                    #087ab4
                );

            color: white;
            font-size: 38px;

            box-shadow:
                0 12px 28px rgba(0, 125, 83, 0.28);
        }

        .titulo {
            margin: 0;
            color: #102239;
            font-size: 30px;
            font-weight: 750;
            letter-spacing: -0.5px;
        }

        .subtitulo {
            margin-top: 7px;
            margin-bottom: 0;
            color: #667085;
            font-size: 15px;
        }

        .empresa {
            margin-top: 5px;
            color: #007d53;
            font-size: 14px;
            font-weight: 700;
        }

        .form-label {
            margin-bottom: 7px;
            color: #344054;
            font-size: 14px;
            font-weight: 650;
        }

        .form-control {
            min-height: 50px;
            padding: 12px 15px;

            border: 1px solid #d0d5dd;
            border-radius: 12px;

            font-size: 15px;

            background-color: rgba(255, 255, 255, 0.92);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: #07875d;

            box-shadow:
                0 0 0 4px rgba(7, 135, 93, 0.14);
        }

        .form-control::placeholder {
            color: #98a2b3;
        }

        .btn-login {
            width: 100%;
            min-height: 50px;
            margin-top: 6px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #007d53,
                    #087ab4
                );

            color: white;
            font-size: 16px;
            font-weight: 700;

            box-shadow:
                0 10px 24px rgba(0, 125, 83, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .btn-login:hover {
            color: white;
            transform: translateY(-2px);
            filter: brightness(1.04);

            box-shadow:
                0 14px 28px rgba(0, 125, 83, 0.32);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            border: none;
            border-radius: 12px;
            font-size: 14px;
        }

        .rodape {
            margin-top: 24px;
            padding-top: 18px;

            border-top: 1px solid #eaecf0;

            color: #98a2b3;
            text-align: center;
            font-size: 12px;
        }

        @keyframes entrada {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width: 992px) {

            body {
                justify-content: center;
                padding: 30px;
                background-position: center;
            }

        }

        @media (max-width: 576px) {

            body {
                padding: 20px;
                align-items: center;

                background:
                    linear-gradient(
                        rgba(3, 15, 35, 0.62),
                        rgba(3, 15, 35, 0.72)
                    ),
                    url("{% static 'img/login-background.png' %}");

                background-size: cover;
                background-position: center;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 20px;
            }

            .titulo {
                font-size: 26px;
            }

            .logo {
                width: 64px;
                height: 64px;
                font-size: 34px;
            }

        }

    </style>

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="marca">

                <div class="logo">
                    🦺
                </div>

                <h1 class="titulo">
                    Controle de EPI
                </h1>

                <p class="subtitulo">
                    Sistema de Gestão de Equipamentos
                </p>

                <div class="empresa">
                    EcoCristal
                </div>

            </div>

            <form method="post" autocomplete="off">

                {% csrf_token %}

                {% if form.errors %}

                    <div class="alert alert-danger" role="alert">
                        Usuário ou senha inválidos.
                    </div>

                {% endif %}

                <div class="mb-3">

                    <label
                        for="id_username"
                        class="form-label"
                    >
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="id_username"
                        name="username"
                        class="form-control"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="id_password"
                        class="form-label"
                    >
                        Senha
                    </label>

                    <input
                        type="password"
                        id="id_password"
                        name="password"
                        class="form-control"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-login"
                >
                    Entrar no sistema
                </button>

            </form>

            <div class="rodape">
                EcoCristal • Controle de EPI v1.0
            </div>

        </section>

    </main>

</body>

</html>
