{% extends 'public/base_public.html' %}

{% block content %}

<div class="card">

    <div class="card-body">

        <h2>
            Confirmar Recebimento
        </h2>

        <hr>

        <p>
            <strong>Funcionário:</strong>
            {{ entrega.funcionario.nome }}
        </p>

        <p>
            <strong>EPI:</strong>
            {{ entrega.epi.nome }}
        </p>

        <p>
            <strong>Quantidade:</strong>
            {{ entrega.quantidade }}
        </p>

        <form method="post" id="formConfirmacao">

            {% csrf_token %}

            <button
                type="button"
                id="btnBiometria"
                class="btn btn-success">

                Confirmar com Biometria

            </button>

        </form>

    </div>

</div>

<script>

document
.getElementById('btnBiometria')
.addEventListener('click', async () => {

    try {

        const response =
            await fetch(
                '/biometria/autenticar/opcoes/{{ entrega.funcionario.id }}/'
            );

        const options =
            await response.json();

        console.log(options);

        alert(
            'Biometria encontrada para o funcionário.'
        );

        document
            .getElementById(
                'formConfirmacao'
            )
            .submit();

    }

    catch(error) {

        console.error(error);

        alert(
            'Falha na autenticação biométrica.'
        );
    }

});

</script>

{% endblock %}
